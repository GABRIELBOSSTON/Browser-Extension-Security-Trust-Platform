[package]
name = "antigraviiti-extension-protect"
version = "0.1.0"
description = "Antigraviiti Extension Protect (AEP) Desktop Agent Core"
authors = ["Antigraviiti Security Engineering Team"]
edition = "2021"
default-run = "antigraviiti-extension-protect"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1.37", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4"] }
tokio-util = "0.7"
swc_common = "24"
swc_ecma_parser = "43"
swc_ecma_ast = "27"
swc_ecma_visit = "27"
chrono = { version = "0.4.45", features = ["serde"] }
zip = "8.6.0"
dirs = "6.0.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3.10"
